<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with squircle corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Outer Display Frame -->
  <rect x="76" y="86" width="360" height="340" rx="36" fill="#0f172a" fill-opacity="0.8" stroke="url(#accentGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Message Chat Bubble & Lightning Cast Symbol -->
  <path d="M140 160 C140 140 160 120 200 120 L312 120 C352 120 372 140 372 160 L372 280 C372 300 352 320 312 320 L230 320 L170 370 L180 320 L160 320 C140 320 140 300 140 280 Z" fill="url(#accentGrad)" opacity="0.25" />
  
  <!-- Center Flash Icon -->
  <path d="M276 140 L190 270 L250 270 L230 372 L322 242 L262 242 Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Full Display Corner Expand Marks -->
  <path d="M106 136 L106 116 L126 116" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M406 136 L406 116 L386 116" stroke="#06b6d4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M106 376 L106 396 L126 396" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M406 376 L406 396 L386 396" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
