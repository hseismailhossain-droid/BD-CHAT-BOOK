    <script>
      // Cleanly filter benign Vite HMR dev-server websocket messages in preview sandbox
      (function() {
        function shouldSuppress(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg) || '');
          return str.indexOf('[vite]') !== -1 || str.indexOf('failed to connect to websocket') !== -1 || str.indexOf('vite-hmr') !== -1;
        }
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          console[method] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (shouldSuppress(arguments[i])) return;
            }
            if (orig) orig.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          if (e && (shouldSuppress(e.message) || shouldSuppress(e.filename))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && shouldSuppress(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
